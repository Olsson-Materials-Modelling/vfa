[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vfa"
version = "1.0.0"
description = "Vitriflow enhanced analysis: structural descriptors and void geometry of periodic network structures"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Olsson Materials Modelling"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.19", "pandas>=2.0"]

[tool.setuptools]
packages = ["vfa", "vfa.io", "vfa.structure", "vfa.voids", "vfa.stats", "vfa.electronic", "vfa.corrections"]

[tool.setuptools.package-data]
vfa = ["data/*.json", "data/README.md"]
